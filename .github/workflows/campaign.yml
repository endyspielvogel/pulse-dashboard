
name: PULSE Campaign Spotlight Update

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  update-campaign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Campaign articles
        run: python scripts/fetch_campaign.py

      - name: Save Campaign data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/campaign.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Campaign Spotlight"
            git push
          fi
