name: Update Social & Culture Pulse
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch social and cultural discoveries
        run: python scripts/fetch_culture_pulse.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/culture_pulse.json
          git diff --cached --quiet || (git commit -m "Update Social and Culture Pulse" && git push)
