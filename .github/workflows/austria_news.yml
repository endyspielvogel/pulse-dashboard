
name: PULSE Austria News Update

on:
  workflow_dispatch:
  schedule:
    - cron: '3,18,33,48 * * * *'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Austrian headlines
        run: python scripts/fetch_austria_news.py

      - name: Save updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Austrian news"
            git push
          fi
